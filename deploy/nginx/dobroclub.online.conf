# nginx server-блок для dobroclub.online (host-nginx, рядом с buymytag — не конфликтует).
# Положить в /etc/nginx/sites-available/dobroclub.online и слинковать в sites-enabled.
# После того как DNS зарезолвится: certbot --nginx -d dobroclub.online (добавит 443 + редирект).

server {
    listen 80;
    listen [::]:80;
    server_name dobroclub.online;

    # Статика собранного фронтенда (Vite build)
    root /var/www/dobroclub/dist;
    index index.html;

    # Бэкенд за /api/ — trailing slash срезает префикс: /api/auth/.. -> /auth/..
    location /api/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Хешированные ассеты (Vite) неизменяемы — кэшируем надолго.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback. index.html НЕ кэшируем, иначе клиенты (особенно Telegram
    # WebView) застревают на старом бандле и ломается авторизация/верстка.
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    client_max_body_size 10M;
}
